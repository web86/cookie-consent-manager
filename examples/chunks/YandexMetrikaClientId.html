<!-- User-owned example. Create a chunk yourself; the package never installs it.
     Place [[$YandexMetrikaClientId]] after [[!CookieConsentBanner]].
     The optional target #clientid is owned by your form integration.
     Replace service:'yandex' if you use a different registered instance key. -->
<script>
(function () {
    function register() {
        const service = window.web86Providers?.services.find(s => s.key === 'yandex' && s.loader === 'yandex');
        if (!service || !window.web86CookieConsent) return;
        window.web86CookieConsent.onAllowed(service.category, function (stillAllowed) {
            const target = document.getElementById('clientid');
            if (!target || !stillAllowed() || typeof window.ym !== 'function') return;
            window.ym(Number(service.config.id), 'getClientID', function (clientId) {
                if (stillAllowed() && target.isConnected && typeof clientId === 'string' && clientId) target.setAttribute('data-clientid', clientId);
            });
        }, {service: service.key});
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', register, {once:true});
    else register();
})();
</script>
