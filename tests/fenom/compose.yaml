name: cookie-consent-acceptance
services:
  fenom:
    image: cookie-consent-acceptance-web:latest
    ports: ['127.0.0.1:18988:80']
    volumes:
      - ../../.local/fenom/site:/var/www/html
      - ../../.local/fenom/private:/opt/cc-private
      - ../../:/opt/cc-source:ro
    environment:
      CC_DB_PASSWORD: ${CC_DB_PASSWORD:?}
      COOKIE_CONSENT_LOCAL_HTTP: '1'
