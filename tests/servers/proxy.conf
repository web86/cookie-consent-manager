server {
 listen 80;
 location = /assets/components/cookieconsent/audit.php {
  if ($http_user_agent = "CookieConsent-Manager-AuditCheck") { return 403; }
  proxy_pass http://clean:80;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
 }
 location / {
  proxy_pass http://clean:80;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  add_header Via '1.1 local-acceptance-proxy' always;
 }
}
