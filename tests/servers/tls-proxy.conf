server {
 listen 8893 ssl;
 ssl_certificate /opt/cc-test-tls/site.pem;
 ssl_certificate_key /opt/cc-test-tls/site.key;
 location / {
  proxy_pass http://nginx:8080;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 }
}
server {
 listen 8894;
 return 301 https://cc-tls.test:8893$request_uri;
}
server {
 listen 8895 ssl;
 ssl_certificate /opt/cc-test-tls/untrusted.pem;
 ssl_certificate_key /opt/cc-test-tls/untrusted.key;
 location / { proxy_pass http://clean:80; proxy_set_header Host $http_host; }
}
