server {
 listen 80; root /var/www/html; index index.php;
 location / { try_files $uri $uri/ /index.php?$args; }
 location ~ ^/core/ { deny all; }
 location ~ \.php$ {
  include fastcgi_params;
  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
  fastcgi_pass fpm:9000;
 }
}

# Dedicated internal backend for the TLS-terminating fixture proxy. HTTPS is a
# trusted vhost property, not inferred in the component from forwarded headers.
server {
 listen 8080; root /var/www/html; index index.php;
 location / { try_files $uri $uri/ /index.php?$args; }
 location ~ ^/core/ { deny all; }
 location ~ \.php$ {
  include fastcgi_params;
  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
  fastcgi_param HTTPS on;
  fastcgi_pass fpm:9000;
 }
}
