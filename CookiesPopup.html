<!--
  data-cc-text и data-cc-html — места для серверной подстановки переводов.
  CookieConsentBannerRenderer заполняет их на PHP до отправки HTML браузеру:
  значения берутся из вкладки «Тексты», с fallback на stock-лексиконы RU/EN.
  Пустые элементы ниже — шаблон чанка, а не готовый публичный баннер.
-->
<div id="cookie-block" class="cookie-warning closed done" role="region" data-cc-aria="region_label">
  <div class="cookie-warning-content">
    <div class="cookie-warning-2" data-cc-panel="main">
      <div class="cookie-warning-text" data-cc-html="notice_html"></div>
      <div class="cookie-warning-buttons">
        <button type="button" class="btn cookie-btn cookie-btn--secondary" data-cc-action="reject" data-cc-text="reject"></button>
        <button type="button" class="btn cookie-btn cookie-btn--secondary" data-cc-action="configure" data-cc-text="configure"></button>
        <button type="button" class="btn cookie-btn cookie-btn--primary" data-cc-action="accept-all" data-cc-text="accept_all"></button>
        <button type="button" class="btn cookie-btn cookie-btn--primary" data-cc-action="accept" data-cc-text="accept"></button>
      </div>
    </div>
    <section class="cookie-warning-settings" data-cc-panel="settings" aria-labelledby="cookie-settings-title" hidden>
      <h2 id="cookie-settings-title" tabindex="-1" data-cc-text="settings_title"></h2>
      <p data-cc-text="settings_intro"></p>
      <label class="cookie-option" data-cc-category-row="necessary">
        <span class="cookie-option__text"><strong data-cc-text="necessary_name"></strong><small data-cc-text="necessary_description"></small></span>
        <input type="checkbox" checked disabled data-cc-aria="necessary_aria">
      </label>
      <label class="cookie-option" data-cc-category-row="analytics">
        <span class="cookie-option__text"><strong data-cc-text="analytics_name"></strong><small data-cc-text="analytics_description"></small></span>
        <input type="checkbox" data-cc-category="analytics">
      </label>
      <label class="cookie-option" data-cc-category-row="marketing">
        <span class="cookie-option__text"><strong data-cc-text="marketing_name"></strong><small data-cc-text="marketing_description"></small></span>
        <input type="checkbox" data-cc-category="marketing">
      </label>
      <label class="cookie-option" data-cc-category-row="external_content">
        <span class="cookie-option__text"><strong data-cc-text="external_content_name"></strong><small data-cc-text="external_content_description"></small></span>
        <input type="checkbox" data-cc-category="external_content">
      </label>
      <div class="cookie-warning-settings__buttons">
        <button type="button" class="btn cookie-btn cookie-btn--secondary" data-cc-action="back" data-cc-text="back"></button>
        <button type="button" class="btn cookie-btn cookie-btn--primary" data-cc-action="save" data-cc-text="save"></button>
      </div>
    </section>
  </div>
</div>
